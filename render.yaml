services:
  - type: web
    name: zenfit-backend
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    dockerCommand: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/v1/health
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: BACKEND_CORS_ORIGINS
        sync: false
      - key: BACKEND_CORS_ORIGIN_REGEX
        sync: false
      - key: USDA_FDC_API_KEY
        sync: false
      - key: AI_HEAVY_MODELS_ENABLED
        value: "false"
      - key: AI_PREWARM_MODELS
        value: "false"
      - key: AI_ARTIFACT_STORAGE_BACKEND
        value: local
  - type: worker
    name: zenfit-worker
    runtime: docker
    dockerContext: ./backend
    dockerfilePath: ./backend/Dockerfile
    dockerCommand: python -m app.workers.main
    envVars:
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: AI_HEAVY_MODELS_ENABLED
        value: "false"
      - key: AI_PREWARM_MODELS
        value: "false"
